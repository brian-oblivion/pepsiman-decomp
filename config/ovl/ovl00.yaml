# Overlay 00: the mode main loads first (GM_OVERLAY0), CDDATA/1/1000 on the disc
# (tools/extract_overlays.py writes it to disk/ovl/ovl00.bin).
#
# ADDRESSING. A bare image, no header: main's mode switch reads the file to 0x800F0000,
# so vram = 0x800F0000 + file offset. It reaches the executable's symbols by
# their absolute addresses, so the executable's symbols file is read first
# and anything it calls lands in this overlay's undefined_*_auto files.
#
# SEGMENTATION, measured: rodata, then code from the first function to the
# last `jr $ra`, then data to the end of the file.
name: ovl00
sha1: 8f5d0b4517421681109b49b990da2de03e6583a4
options:
  basename: ovl00
  platform: psx
  compiler: GCC

  base_path: ../..
  target_path: disk/ovl/ovl00.bin
  asm_path:    asm/ovl/ovl00/
  asset_path:  assets/ovl00/
  src_path:    src/ovl/
  symbol_addrs_path:
    - config/symbols.slps01762.pepsiman.txt
    - config/ovl/symbols.ovl00.txt
  undefined_funcs_auto_path:   config/ovl/undefined_funcs_auto.ovl00.txt
  undefined_syms_auto_path:    config/ovl/undefined_syms_auto.ovl00.txt
  ld_script_path: build/ovl/ovl00.ld

  find_file_boundaries: True
  pair_rodata_to_text: False
  migrate_rodata_to_functions: True

  o_as_suffix: False
  use_legacy_include_asm: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel

  section_order: [".rodata", ".text", ".data"]

  subalign: 4
  # The file ends on a halfword; no padding after the last section.
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

segments:
  - name: ovl00
    type: code
    start: 0x0
    vram: 0x800F0000
    align: 4
    subsegments:
      - [0x0, .rodata, ovl00]
      - [0x26C, c, ovl00]
      # The file is 0x1CFE bytes, not a whole number of words: the data
      # ends in a halfword.
      - [0x1238, .data, ovl00]
  - [0x1CFE]
