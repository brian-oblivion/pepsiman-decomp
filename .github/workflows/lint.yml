# Disc-free checks: formatting, documentation, readability counters,
# declarations and file names (tools/lint.sh), plus a Doxygen build. Runs on
# every push and pull request, forks included. The two checks that preprocess
# the source (apidoc, declcheck) need Sony's headers, which are never in this
# repository: with the DEPS_TOKEN secret (build.yml) they come from the
# private dependencies repository, and without it lint.sh skips those two.
name: lint

on:
  push:
  pull_request:

# A newer push to the same branch cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      HAVE_DEPS: ${{ secrets.DEPS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Sony's headers (private, optional)
        if: env.HAVE_DEPS == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DEPS_REPO }}
          token: ${{ secrets.DEPS_TOKEN }}
          path: .deps
          sparse-checkout: include/psyq

      - name: Place them
        if: env.HAVE_DEPS == 'true'
        run: cp -r .deps/include/psyq include/ && rm -rf .deps

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # .clang-format is written for clang-format 22; tools/lint.sh refuses any
      # other major, because another major formats differently. Doxygen is
      # pinned for the same reason: Ubuntu's 1.9 and 1.18 disagree on which
      # @param placements they accept, so CI runs the release the docs are
      # checked against locally, not the distribution's.
      - name: clang-format 22 and Doxygen 1.18.0
        env:
          DOXYGEN_VERSION: 1.18.0
          DOXYGEN_SHA256: 14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90
        run: |
          pip install "clang-format==22.*"
          tag="Release_${DOXYGEN_VERSION//./_}"
          tgz="doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tgz" \
            "https://github.com/doxygen/doxygen/releases/download/$tag/$tgz"
          echo "$DOXYGEN_SHA256  $RUNNER_TEMP/$tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/doxygen-${DOXYGEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Toolchain for the lint (venv, the Psy-Q cpp)
        run: ./tools/setup.sh --lint-only

      - name: tools/lint.sh
        run: tools/lint.sh

      # Doxyfile warns on undocumented members and parameters; any warning fails.
      - name: Doxygen
        run: |
          # Doxyfile EXCLUDEs include/psyq; without Sony's headers it does not
          # exist, and Doxygen warns about a missing excluded path.
          mkdir -p build/doxygen include/psyq
          doxygen --version
          doxygen Doxyfile >/dev/null
          if [ -s build/doxygen/warnings.log ]; then
            cat build/doxygen/warnings.log
            echo "::error::Doxygen reported $(wc -l < build/doxygen/warnings.log) warning(s)"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doxygen-html
          path: build/doxygen/html
          if-no-files-found: ignore
          retention-days: 7
