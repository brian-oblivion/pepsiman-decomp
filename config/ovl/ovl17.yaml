# Overlay 17: stage 5-3, CDDATA/G/G000 on the disc
# (tools/extract_overlays.py writes it to disk/ovl/ovl17.bin).
#
# ADDRESSING. A bare image, no header: LoadStageOverlay reads the file to 0x800F0000,
# so vram = 0x800F0000 + file offset. It reaches the executable's symbols by
# their absolute addresses, so the executable's symbols file is read first
# and anything it calls lands in this overlay's undefined_*_auto files.
#
# SEGMENTATION, measured: rodata, then code from the first function to the
# last `jr $ra`, then data to the end of the file. Not yet worked: the rodata
# and data are one block each.
#
# TWO UNITS. The stage's tail (chase_tail.inc: lights, placement, loader,
# reset) is its own unit, ovl17_tail, whose rodata starts at the loader's
# "CDEXEC %d". In every chase the loader's jump table sits 0x10 past that
# string, the 8-byte boundary of an object starting there, which is 4 past
# an absolute one in 08 and 11; one object cannot place it so.
name: ovl17
sha1: 2ba76d4189f0715dc06d978cfc01a3129ee2e39f
options:
  basename: ovl17
  platform: psx
  compiler: GCC

  base_path: ../..
  target_path: disk/ovl/ovl17.bin
  asm_path:    asm/ovl/ovl17/
  asset_path:  assets/ovl17/
  src_path:    src/ovl/
  symbol_addrs_path:
    - config/symbols.slps01762.pepsiman.txt
    - config/ovl/symbols.ovl17.txt
  undefined_funcs_auto_path:   config/ovl/undefined_funcs_auto.ovl17.txt
  undefined_syms_auto_path:    config/ovl/undefined_syms_auto.ovl17.txt
  ld_script_path: build/ovl/ovl17.ld

  find_file_boundaries: True
  pair_rodata_to_text: False
  migrate_rodata_to_functions: True

  o_as_suffix: False
  use_legacy_include_asm: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel

  section_order: [".rodata", ".text", ".data", ".bss"]

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

segments:
  - name: ovl17
    type: code
    start: 0x0
    vram: 0x800F0000
    align: 4
    subsegments:
      - [0x0, .rodata, ovl17]
      - [0x1B0, .rodata, ovl17_tail]
      - [0x1F0, c, ovl17]
      - [0x36A8, c, ovl17_tail]
      - [0x3A4C, data]
  - [0x4B1C]
