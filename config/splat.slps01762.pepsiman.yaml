# Pepsiman (PSX, 1999), Japanese retail release.
#
# ADDRESSING. A plain PS-X EXE: a 0x800-byte header followed by one
# contiguous image loaded at 0x80010000, so
#
#     file offset = vram - 0x80010000 + 0x800
#
# and the whole file is 0x86000 bytes. The entry point (0x80042C58) clears
# .bss from 0x800956D0 to 0x800FAE80 and sets $gp to 0x800954C4.
#
# FIRST-PASS SEGMENTATION, measured from the bytes: rodata from the start of
# the image, code from the first function prologue to the last `jr $ra`,
# then data to the end of the file. Every segment boundary here is a
# starting point to be refined (library objects, per-unit splits).
name: Pepsiman
