# Overlay 10: stage 3-2, CDDATA/9/9000 on the disc
# (tools/extract_overlays.py writes it to disk/ovl/ovl10.bin).
#
# ADDRESSING. A bare image, no header: LoadStageOverlay reads the file to
# 0x800F0000, and stage_overlay.c and stage_flow.c call into it at
# 0x800F1908 (reset), 0x800F1BA4 (start) and 0x800F1A48, so vram = 0x800F0000 + file offset. It reaches the
# executable's symbols by their absolute addresses, so the executable's
# symbols file is read first and anything it calls lands in this overlay's
# undefined_*_auto files.
#
# SEGMENTATION, measured: rodata (a format string, a jump table and two byte
# tables), then code from the first prologue to the last `jr $ra`, then data:
# three copies of disc_files.inc's table, the stage-hint file's tables, and
# 400 zero bytes, the .bss, to the end of the file. All of it is
# stage3.inc's, one unit.
name: ovl10
sha1: af22fc6ca3e06547a3b0e1e694ba142ab17882f6
options:
  basename: ovl10
  platform: psx
  compiler: GCC

  base_path: ../..
  target_path: disk/ovl/ovl10.bin
  asm_path:    asm/ovl/ovl10/
  asset_path:  assets/ovl10/
  src_path:    src/ovl/
  symbol_addrs_path:
    - config/symbols.slps01762.pepsiman.txt
    - config/ovl/symbols.ovl10.txt
  undefined_funcs_auto_path:   config/ovl/undefined_funcs_auto.ovl10.txt
  undefined_syms_auto_path:    config/ovl/undefined_syms_auto.ovl10.txt
  ld_script_path: build/ovl/ovl10.ld

  find_file_boundaries: True
  pair_rodata_to_text: False
  migrate_rodata_to_functions: True

  o_as_suffix: False
  use_legacy_include_asm: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel

  section_order: [".rodata", ".text", ".data", ".bss"]

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

segments:
  - name: ovl10
    type: code
    start: 0x0
    vram: 0x800F0000
    align: 4
    subsegments:
      - [0x0, .rodata, ovl10]
      - [0xA0, c, ovl10]
      - [0x1D38, .data, ovl10]
  - [0x3000]
