# Overlay 08: stage 2-3, CDDATA/7/7000 on the disc
# (tools/extract_overlays.py writes it to disk/ovl/ovl08.bin).
#
# ADDRESSING. A bare image, no header: LoadStageOverlay reads the file to 0x800F0000,
# so vram = 0x800F0000 + file offset. It reaches the executable's symbols by
# their absolute addresses, so the executable's symbols file is read first
# and anything it calls lands in this overlay's undefined_*_auto files.
#
# SEGMENTATION, measured: rodata, then code from the first function to the
# last `jr $ra`, then data to the end of the file: the main unit's .data,
# the tail's (which starts at its own copy of disc_files.inc's table, the
# second in the file), then the main unit's .bss, zeros in the file.
#
# TWO UNITS. The stage's tail (chase_tail.inc: lights, placement, loader,
# reset) is its own unit, ovl08_tail, whose rodata starts at the loader's
# "CDEXEC %d". In every chase the loader's jump table sits 0x10 past that
# string, the 8-byte boundary of an object starting there, which is 4 past
# an absolute one in 08 and 11; one object cannot place it so.
name: ovl08
sha1: 6f3be02a829482b3b065b26946e850abbfcc02bd
options:
  basename: ovl08
  platform: psx
  compiler: GCC

  base_path: ../..
  target_path: disk/ovl/ovl08.bin
  asm_path:    asm/ovl/ovl08/
  asset_path:  assets/ovl08/
  src_path:    src/ovl/
  symbol_addrs_path:
    - config/symbols.slps01762.pepsiman.txt
    - config/ovl/symbols.ovl08.txt
  undefined_funcs_auto_path:   config/ovl/undefined_funcs_auto.ovl08.txt
  undefined_syms_auto_path:    config/ovl/undefined_syms_auto.ovl08.txt
  ld_script_path: build/ovl/ovl08.ld

  find_file_boundaries: True
  pair_rodata_to_text: False
  migrate_rodata_to_functions: True

  o_as_suffix: False
  use_legacy_include_asm: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel

  section_order: [".rodata", ".text", ".data", ".bss"]

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

segments:
  - name: ovl08
    type: code
    start: 0x0
    vram: 0x800F0000
    align: 4
    subsegments:
      - [0x0, .rodata, ovl08]
      - [0x174, .rodata, ovl08_tail]
      - [0x1B4, c, ovl08]
      - [0x696C, c, ovl08_tail]
      - [0x6D14, .data, ovl08]
      - [0x7AA4, .data, ovl08_tail]
  - [0x8048]
