# Pepsiman (PSX, 1999), Japanese retail release.
#
# ADDRESSING. A plain PS-X EXE: a 0x800-byte header followed by one
# contiguous image loaded at 0x80010000, so
#
#     file offset = vram - 0x80010000 + 0x800
#
# and the whole file is 0x86000 bytes. The entry point (0x80042C58) clears
# .bss from 0x800956D0 to 0x800FAE80 and sets $gp to 0x800954C4.
#
# FIRST-PASS SEGMENTATION, measured from the bytes: rodata from the start of
# the image, code from the first function prologue to the last `jr $ra`,
# then data to the end of the file. Every segment boundary here is a
# starting point to be refined (library objects, per-unit splits).
name: Pepsiman
sha1: 116d895763ebef141b4e2c3c90c1b227d257b804
options:
  basename: pepsiman
  platform: psx
  compiler: GCC

  base_path: ..
  target_path: disk/SLPS_017.62
  asm_path:    asm/
  asset_path:  assets/
  src_path:    src/
  o_path:      lib/
  symbol_addrs_path: config/symbols.slps01762.pepsiman.txt
  undefined_funcs_auto_path:   config/undefined_funcs_auto.slps01762.pepsiman.txt
  undefined_syms_auto_path:    config/undefined_syms_auto.slps01762.pepsiman.txt
  ld_script_path: pepsiman.ld

  find_file_boundaries: True
  pair_rodata_to_text: False
  migrate_rodata_to_functions: True
  gp_value: 0x800954C4

  o_as_suffix: False
  use_legacy_include_asm: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

segments:
  - name: header
    type: header
    start: 0x0

  - name: main
    type: code
    start: 0x800
    vram: 0x80010000
    align: 4
    subsegments:
      - [0x800, .rodata, main]
      - [0x293C, o, libspu/spu, .rdata]
      - [0x298C, o, libsnd/ssopenq, .rdata]
      - [0x29BC, o, libsnd/seqinit, .rdata]
      - [0x29FC, rodata]
      - [0x396C, c, main]
      # Sony from here to the end of the code: SN's crt0 (libsn/snmain, the
      # entry point; psyq-obj-parser cannot convert it) and then the Psy-Q 4.4
      # Runtime Library objects (tools/psyq_sdk.py, GAME_SDK). One asm block
      # until the objects are converted in runs (docs/lsd-reference/
      # SDK-OBJECTS-GUIDE.md).
      - [0x33458, asm, psyq_33458]            # __SN_ENTRY_POINT (libsn/snmain)
      - [0x33514, o, libmath/fltsidf]         # __floatsidf
      - [0x33634, o, libmath/dbshiftu]        # _dbl_shift_us
      - [0x336F4, o, libmath/ltdf2]           # __ltdf2
      - [0x337D4, o, libmath/muldf3]          # __muldf3, _mul_mant_d
      - [0x33BD4, o, libmath/addmant]         # _add_mant_d
      - [0x33C84, o, libmath/ferr]            # _err_math
      - [0x33CF4, o, libsnd/ssclose]          # SsSeqClose, SsSepClose
      - [0x33EC4, o, libsnd/ssinit]           # _SsInit
      - [0x33F64, o, libsnd/ssinit_c]         # SsInit
      - [0x33FA4, o, libspu/s_i]              # SpuInit
      - [0x33FC4, o, libspu/s_ini]            # _SpuInit, SpuStart
      - [0x34124, o, libspu/spu]              # _spu_init, _spu_Fw1ts, _spu_FiDMA, _spu_Fr_, _spu_t, _spu_
      - [0x34C64, o, libspu/s_dcb]            # _SpuDataCallback
      - [0x34C94, o, libspu/s_crwa]           # SpuClearReverbWorkArea
      - [0x34E34, o, libspu/s_m_util]         # _SpuIsInAllocateArea, _SpuIsInAllocateArea_
      - [0x34F44, o, libsnd/ssloop]           # SsSetLoop, SsIsEos
      - [0x34FC4, o, libsnd/ssopenq]          # SsSeqOpen
      - [0x35254, o, libsnd/cc_0]             # _SsContBankChange
      - [0x352D4, o, libsnd/cc_6]             # _SsContDataEntry
      - [0x35654, o, libsnd/cc_7]             # _SsContMainVol
      - [0x35724, o, libsnd/cc_10]            # _SsContPanpot
      - [0x357F4, o, libsnd/cc_11]            # _SsContExpression
      - [0x358E4, o, libsnd/cc_64]            # _SsContDamper
      - [0x35994, o, libsnd/cc_91]            # _SsContExternal
      - [0x35A24, o, libsnd/cc_98]            # _SsContNrpn1
      - [0x35B24, o, libsnd/cc_99]            # _SsContNrpn2
      - [0x35C64, o, libsnd/cc_100]           # _SsContRpn1
      - [0x35CD4, o, libsnd/cc_101]           # _SsContRpn2
      - [0x35D44, o, libsnd/cc_121]           # _SsContResetAll
      - [0x35E04, o, libsnd/de_0]             # _SsSetNrpnVabAttr0
      - [0x35E94, o, libsnd/de_1]             # _SsSetNrpnVabAttr1
      - [0x35F54, o, libsnd/de_2]             # _SsSetNrpnVabAttr2
      - [0x35FE4, o, libsnd/de_3]             # _SsSetNrpnVabAttr3
      - [0x36074, o, libsnd/de_4]             # _SsSetNrpnVabAttr4
      - [0x36124, o, libsnd/ccadsr]           # _SsUtResolveADSR, _SsUtBuildADSR
      - [0x36224, o, libsnd/de_5]             # _SsSetNrpnVabAttr5
      - [0x362E4, o, libsnd/de_6]             # _SsSetNrpnVabAttr6
      - [0x36394, o, libsnd/de_7]             # _SsSetNrpnVabAttr7
      - [0x36444, o, libsnd/de_8]             # _SsSetNrpnVabAttr8
      - [0x364F4, o, libsnd/de_9]             # _SsSetNrpnVabAttr9
      - [0x365B4, o, libsnd/de_10]            # _SsSetNrpnVabAttr10
      - [0x36664, o, libsnd/de_11]            # _SsSetNrpnVabAttr11
      - [0x36714, o, libsnd/de_12]            # _SsSetNrpnVabAttr12
      - [0x367F4, o, libsnd/de_13]            # _SsSetNrpnVabAttr13
      - [0x36894, o, libsnd/de_14]            # _SsSetNrpnVabAttr14
      - [0x36934, o, libsnd/de_15]            # _SsSetNrpnVabAttr15
      - [0x36964, o, libsnd/de_16]            # _SsSetNrpnVabAttr16
      - [0x36994, o, libsnd/de_17]            # _SsSetNrpnVabAttr17
      - [0x369C4, o, libsnd/de_18]            # _SsSetNrpnVabAttr18
      - [0x369F4, o, libsnd/de_19]            # _SsSetNrpnVabAttr19
      - [0x36A24, o, libsnd/midibend]         # _SsSetPitchBend
      - [0x36AD4, o, libsnd/midicc]           # _SsSetControlChange
      - [0x36D04, o, libsnd/midimeta]         # _SsGetMetaEvent
      - [0x36ED4, o, libsnd/midinote]         # _SsNoteOn
      - [0x36FB4, o, libsnd/midiprog]         # _SsSetProgramChange
      - [0x37024, o, libsnd/miditime]         # _SsReadDeltaValue
      - [0x370D4, o, libsnd/seqinit]          # _SsInitSoundSeq
      - [0x37424, o, libsnd/ssplay]           # SsSeqPlay, SsSepPlay
      - [0x374A4, o, libsnd/playmode]         # Snd_SetPlayMode
      - [0x375C4, o, libsnd/sssattr]          # SsSetSerialAttr
      - [0x37684, asm, psyq_37684]
      - [0x62C84, data]
      - [0x6C42C, o, libmath/ferr, .data]
      - [0x6C43C, o, libsnd/ssinit, .data]
      - [0x6C46C, o, libspu/s_ini, .data]
      - [0x6C4EC, o, libspu/spu, .data]
      - [0x6C54C, data]
      # $gp is 0x800954C4 and the lowest gp-relative access in the code is
      # $gp+0x1FE, so .sdata starts at $gp. crt0 clears from 0x800956D0,
      # which is where .sbss starts; its first 0x130 bytes are still inside
      # the file (zeros) and the rest of .bss lies past the image's end.
      - [0x85CC4, sdata]
      - [0x85ED0, sbss]

  - [0x86000]
