# Overlay 20: the world 3 intro, CDDATA/1/1300 on the disc
# (tools/extract_overlays.py writes it to disk/ovl/ovl20.bin).
#
# ADDRESSING. A bare image, no header: LoadOverlay reads the file to
# 0x800F0000 and main.c calls into it at 0x800F0480 (GM_WORLD_INTRO, world 3),
# so vram = 0x800F0000 + file offset. It reaches the executable's symbols by
# their absolute addresses, so the executable's symbols file is read first
# and anything it calls lands in this overlay's undefined_*_auto files.
#
# SEGMENTATION, measured: one jump table (no caption table), then code from
# the first prologue to the last `jr $ra`, then data to the end of the file.
# No instruction uses $gp.
name: ovl20
sha1: 77803a4ef46689311c87ffab8ab95e603c928652
options:
  basename: ovl20
  platform: psx
  compiler: GCC

  base_path: ../..
  target_path: disk/ovl/ovl20.bin
  asm_path:    asm/ovl/ovl20/
  asset_path:  assets/ovl20/
  src_path:    src/ovl/
  symbol_addrs_path:
    - config/symbols.slps01762.pepsiman.txt
    - config/ovl/symbols.ovl20.txt
  undefined_funcs_auto_path:   config/ovl/undefined_funcs_auto.ovl20.txt
  undefined_syms_auto_path:    config/ovl/undefined_syms_auto.ovl20.txt
  ld_script_path: build/ovl/ovl20.ld

  find_file_boundaries: True
  pair_rodata_to_text: False
  migrate_rodata_to_functions: True

  o_as_suffix: False
  use_legacy_include_asm: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel

  section_order: [".rodata", ".text", ".data"]

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

segments:
  - name: ovl20
    type: code
    start: 0x0
    vram: 0x800F0000
    align: 4
    subsegments:
      - [0x0, .rodata, ovl20]
      - [0x68, c, ovl20]                  # 5 functions
      - [0x12AC, data]
  - [0x2C78]
